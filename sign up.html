<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FASCO | Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Volkhov:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  </head>

  <body class="font-[Poppins] text-neutral-800 antialiased">
    <main class="flex min-h-screen items-center justify-center bg-white p-4 md:p-8">
      <section class="relative flex min-h-[627px] w-full max-w-[1114px] overflow-hidden border border-[#dedede] bg-white">
        <div class="hidden w-[49.4%] shrink-0 lg:block">
          <img
            src="assets/Rectangle 19280(2).png"
            alt="Woman wearing a red suit"
            class="h-full w-full object-cover"
          />
        </div>

        <div class="flex w-full items-center justify-center px-6 py-10 lg:w-[50.6%] lg:px-8 lg:py-0">
          <div class="w-full max-w-[386px]">
            <h1 class="font-[Volkhov] text-[42px] font-bold leading-none text-[#4a4a4a]">
              FASCO
            </h1>

            <h2 class="mt-11 font-[Volkhov] text-[18px] font-normal leading-tight text-black">
              Create Account
            </h2>
            
            <div class="mt-4 flex flex-wrap gap-7">
              <button
                type="button"
                class="flex h-[33px] w-[170px] items-center justify-center gap-2 rounded-[5px] border border-[#8ca4dc] bg-white text-[10px] tracking-wide text-[#333] transition hover:bg-[#f8fbff] focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
              >
                <img src="assets/image 939.png" alt="" class="h-5 w-5" />
                <span>Sign up with Google</span>
              </button>

              <button
                type="button"
                class="flex h-[33px] w-[158px] items-center justify-center gap-2 rounded-[5px] border border-[#8ca4dc] bg-white text-[10px] tracking-wide text-[#333] transition hover:bg-[#f8fbff] focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
              >
                <img src="assets/image 940.png" alt="" class="h-5 w-5" />
                <span>Sign up with Email</span>
              </button>
            </div>

            <div class="mt-12 flex items-center justify-center gap-2" aria-hidden="true">
              <span class="h-[2px] w-[18px] bg-[#888]"></span>
              <span class="text-[17px] font-semibold tracking-wider text-[#888]">OR</span>
              <span class="h-[2px] w-[18px] bg-[#888]"></span>
            </div>

            <form action="#" method="post" class="mt-8">
              <div class="grid grid-cols-2 gap-x-3 gap-y-4">
                <div>
                  <label for="first-name" class="sr-only">First Name</label>
                  <input
                    id="first-name"
                    name="firstName"
                    type="text"
                    placeholder="First Name"
                    autocomplete="given-name"
                    required
                    class="w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
                  />
                </div>

                <div>
                  <label for="last-name" class="sr-only">Last Name</label>
                  <input
                    id="last-name"
                    name="lastName"
                    type="text"
                    placeholder="Last Name"
                    autocomplete="family-name"
                    required
                    class="w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
                  />
                </div>

                <div>
                  <label for="email" class="sr-only">Email Address</label>
                  <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                    class="w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
                  />
                </div>

                <div>
                  <label for="phone" class="sr-only">Phone Number</label>
                  <input
                    id="phone"
                    name="phone"
                    type="tel"
                    placeholder="Phone Number"
                    autocomplete="tel"
                    class="w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
                  />
                </div>

                <div>
                  <label for="password" class="sr-only">Password</label>
                  <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    required
                    class="w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
                  />
                </div>

                <div>
                  <label for="confirm-password" class="sr-only">Confirm Password</label>
                  <input
                    id="confirm-password"
                    name="confirmPassword"
                    type="password"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required
                    class="w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
                  />
                </div>
              </div>

              <button
                type="submit"
                class="mt-6 h-[35px] w-full rounded-[7px] bg-black text-[10px] font-semibold tracking-wider text-white shadow-[0_10px_18px_rgba(0,0,0,0.2)] transition hover:bg-neutral-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2"
              >
                Create Account
              </button>
            </form>

            <p class="mt-4 text-center text-[10px] tracking-wide text-black">
              Already have an account?
              <a href="signin.html" class="text-[#4a7de0] hover:underline">Login</a>
            </p>
          </div>
        </div>

        <a href="#" class="absolute bottom-[18px] right-[46px] text-[9px] text-black">
          FASCO Terms &amp; Conditions
        </a>
      </section>
    </main>
  </body>
</html>
