<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FASCO | Sign In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Volkhov:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  </head>

  <body class="font-[Poppins] text-neutral-800 antialiased">
    <main
      class="flex min-h-screen items-center justify-center bg-white p-4 md:p-8"
    >
      <section
        class="relative flex min-h-[627px] w-full max-w-[1114px] overflow-hidden rounded-r-[18px] border border-[#dedede] bg-white lg:h-[627px]"
      >
        <div class="hidden w-[49.4%] shrink-0 lg:block">
          <img
            src="assets/Rectangle 19280(1).png"
            alt="Woman in a pink one-shoulder top posing against a colorful painted wall"
            class="h-full w-full object-cover"
          />
        </div>

        <div
          class="flex w-full items-center justify-center px-6 py-10 lg:w-[50.6%] lg:px-8 lg:py-0"
        >
          <div class="w-full max-w-[364px] self-start pt-6 sm:pt-8 lg:mt-[54px] lg:translate-x-[9px] lg:pt-0">
            <h1
              class="font-[Volkhov] text-[40px] font-bold leading-[1.2] text-[#4a4a4a]"
            >
              FASCO
            </h1>

            <h2
              class="mt-[39px] font-[Volkhov] text-[18px] font-normal leading-tight text-black"
            >
              Sign In To FASCO
            </h2>

            <div class="mt-[17px] flex flex-wrap items-center gap-x-9 gap-y-3">
              <button
                type="button"
                class="flex h-[33px] w-[171px] items-center justify-center gap-2 rounded-[5px] border border-[#8ca4dc] bg-white text-[10px] tracking-wide text-[#333] transition hover:bg-[#f8fbff] focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
              >
                <img src="assets/image 939.png" alt="" class="h-5 w-5" />
                <span>Sign up with Google</span>
              </button>

              <button
                type="button"
                class="flex h-[33px] w-[157px] items-center justify-center gap-2 rounded-[5px] border border-[#8ca4dc] bg-white text-[10px] tracking-wide text-[#333] transition hover:bg-[#f8fbff] focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
              >
                <img src="assets/image 940.png" alt="" class="h-5 w-5" />
                <span>Sign up with Email</span>
              </button>
            </div>

            <div
              class="mt-[47px] flex items-center justify-center gap-2"
              aria-hidden="true"
            >
              <span class="h-[2px] w-[18px] bg-[#888]"></span>
              <span class="text-[17px] font-semibold tracking-wider text-[#888]"
                >OR</span
              >
              <span class="h-[2px] w-[18px] bg-[#888]"></span>
            </div>

            <form action="#" method="post" class="mt-[27px]">
              <label for="email" class="sr-only">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
                class="w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
              />

              <label for="password" class="sr-only">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
                class="mt-[17px] w-full border-0 border-b border-[#c7c7c7] bg-transparent px-0 pb-2 pt-1 text-[10px] tracking-wide text-[#222] placeholder-[#999] focus:border-black focus:outline-none focus:ring-0"
              />

              <button
                type="submit"
                class="mt-[26px] h-[35px] w-full rounded-[7px] bg-black text-[10px] font-semibold tracking-wider text-white shadow-[0_10px_18px_rgba(0,0,0,0.2)] transition hover:bg-neutral-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-black focus-visible:ring-offset-2"
              >
                Sign In
              </button>

              <a
                href="sign up.html"
                class="mt-[10px] flex h-[35px] w-full items-center justify-center rounded-[5px] border border-[#8ca4dc] bg-white text-[10px] font-semibold tracking-wider text-[#4a7de0] transition hover:bg-[#f7faff] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#8ca4dc]"
              >
                Register Now
              </a>

              <div class="mt-[9px] text-right">
                <a href="#" class="text-[9px] font-semibold tracking-wide text-[#4a7de0] hover:underline">
                  Forget Password?
                </a>
              </div>
            </form>
          </div>
        </div>

        <a
          href="#"
          class="absolute bottom-[18px] right-[46px] text-[9px] text-black"
        >
          FASCO Terms &amp; Conditions
        </a>
      </section>
    </main>
  </body>
</html>
